name: Continuous integration
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 5"
env:
  CARGO_TERM_COLOR: always
permissions:
  contents: read

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        rust:
          - stable
          - beta
          - 1.89

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        name: Setup toolchain
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt,clippy

      - name: Build
        run: cargo build

      - name: Test
        env:
          CI: true
        run: cargo test --all-features

      - name: Fmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all --all-features -- -D warnings

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      - name: Check feature-powerset
        run: cargo hack check --no-dev-deps --feature-powerset --depth 4

      - name: Tests feature-powerset
        run: cargo hack test --feature-powerset --depth 4

  # Guards against silent `usize` counter wraps in release builds (where `debug_assert!`
  # compiles out): runs the full suite with `overflow-checks` force-enabled on a release
  # profile, so any future state-machine defect fails loudly instead of corrupting state.
  overflow-checks:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C overflow-checks=yes"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        name: Setup toolchain
      - name: Test (release, overflow-checks)
        run: cargo test --release --all-features

  semver-checks:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check semver
        uses: obi1kenobi/cargo-semver-checks-action@v2
