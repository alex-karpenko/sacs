[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# TODO: temporary exceptions, remove once chrono/chrono-tz are replaced (e.g. by jiff) here and in cron-lite
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained; no safe upgrade available yet" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz is unmaintained; no safe upgrade available yet" },
]

[licenses]
allow = ["MIT", "Apache-2.0"]
confidence-threshold = 0.93
exceptions = [{ allow = ["Unicode-3.0"], name = "unicode-ident" }]

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
